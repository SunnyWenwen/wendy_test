# Model registry for LLM Gateway E2E tests.
#
# model_id: The value sent in the API request's "model" field.
#           Must match the alias configured in the LLM Gateway (LiteLLM router).
#
# upstream: The CSP provider behind the gateway (for log assertions).
#
# capabilities:
#   streaming   – supports SSE streaming
#   tool_use    – supports function / tool calling
#   reasoning   – supports extended thinking (reasoning_effort / thinking)
#   vision      – supports image input
#   long_ctx    – context window >= 100k tokens

bedrock:
  claude-sonnet-4-5:
    model_id: "claude-sonnet-4.5"
    upstream: bedrock
    capabilities: [streaming, tool_use, reasoning, vision, long_ctx]

  claude-sonnet-4-6:
    model_id: "claude-sonnet-4.6"
    upstream: bedrock
    capabilities: [streaming, tool_use, reasoning, vision, long_ctx]

  claude-opus-4-6:
    model_id: "claude-opus-4.6"
    upstream: bedrock
    capabilities: [streaming, tool_use, reasoning, vision, long_ctx]

  claude-opus-4-7:
    model_id: "claude-opus-4.7"
    upstream: bedrock
    capabilities: [streaming, tool_use, reasoning, vision, long_ctx]

vertex:
  gemini-2-5-pro:
    model_id: "gemini-2.5-pro"
    upstream: vertex
    capabilities: [streaming, tool_use, reasoning, vision, long_ctx]

  gemini-3-1-flash-lite-preview:
    model_id: "gemini-3.1-flash-lite-preview"
    upstream: vertex
    capabilities: [streaming, tool_use, vision, long_ctx]

  gemini-3-1-pro-preview:
    model_id: "gemini-3.1-pro-preview"
    upstream: vertex
    capabilities: [streaming, tool_use, reasoning, vision, long_ctx]
