[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "llm-gateway-e2e"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",       # parallel test execution
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "python-dotenv>=1.0",
    "rich>=13.7",               # pretty test output
    "kubernetes>=29.0",         # kubectl log via Python k8s client
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "mypy>=1.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "connectivity: basic endpoint reachability",
    "claude_code: Claude Code / CCR agent behaviour",
    "kilo: Kilo agent behaviour",
    "streaming: SSE streaming responses",
    "tool_use: function / tool calling",
    "reasoning: extended thinking / reasoning_effort",
    "bedrock: AWS Bedrock upstream models",
    "vertex: Vertex AI upstream models",
    "slow: tests that take >30 s",
]
log_cli = true
log_cli_level = "INFO"

[tool.ruff.lint]
select = ["E", "F", "I"]
